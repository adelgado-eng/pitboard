name: PitBoard

options:
  bundleIdPrefix: com.pitboard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: "" # rellena tu Team ID de Apple Developer en Xcode > Signing & Capabilities

packages:
  PitBoardKit:
    path: PitBoardKit

targets:
  PitBoard:
    type: application
    platform: iOS
    sources:
      - path: PitBoard
        excludes:
          - "Resources/Info.plist"
    resources:
      - PitBoard/Resources/Assets.xcassets
    info:
      path: PitBoard/Resources/Info.plist
      properties:
        CFBundleDisplayName: PitBoard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.pitboard.app.sync.schedule
          - com.pitboard.app.sync.standings
          - com.pitboard.app.sync.reminders
    entitlements:
      path: PitBoard/PitBoard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pitboard.app
    dependencies:
      - package: PitBoardKit
      - target: PitBoardWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitboard.app
        PRODUCT_NAME: PitBoard
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  PitBoardWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PitBoardWidget
        excludes:
          - "Info.plist"
    resources:
      - PitBoardWidget/Assets.xcassets
    info:
      path: PitBoardWidget/Info.plist
      properties:
        CFBundleDisplayName: PitBoard Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PitBoardWidget/PitBoardWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pitboard.app
    dependencies:
      - package: PitBoardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitboard.app.widget
        PRODUCT_NAME: PitBoardWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  PitBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PitBoardTests
    dependencies:
      - target: PitBoard
      # Sin esto, `import PitBoardKit` en los tests no resolvería — depender de `PitBoard`
      # (el host de este target) no basta para poder importar sus propias dependencias,
      # cada target tiene que declarar explícitamente lo que importa.
      - package: PitBoardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitboard.app.tests

  PitBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PitBoardUITests
    dependencies:
      - target: PitBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitboard.app.uitests
        # Le dice al runner de XCUITest qué app lanzar/controlar — sin esto XcodeGen a
        # veces no infiere el "target application" solo a partir de `dependencies`.
        TEST_TARGET_NAME: PitBoard

schemes:
  PitBoard:
    build:
      targets:
        PitBoard: all
        PitBoardWidgetExtension: all
        PitBoardTests: [test]
        PitBoardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PitBoardTests
        - PitBoardUITests
    archive:
      config: Release
